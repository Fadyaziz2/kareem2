  <title>عقودي - Oqoody</title>

  <script>
    // Early capture of PWA beforeinstallprompt event for Android One-Tap Install
    window.deferredPwaPrompt = null;
    window.pwaPromptReadyListeners = [];

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.deferredPwaPrompt = e;
      console.log('[Oqoody PWA] Native beforeinstallprompt captured successfully.');
      for (var i = 0; i < window.pwaPromptReadyListeners.length; i++) {
        try { window.pwaPromptReadyListeners[i](); } catch (_) {}
      }
    });

    window.addEventListener('appinstalled', function () {
      window.deferredPwaPrompt = null;
      console.log('[Oqoody PWA] Application installed successfully.');
    });

    // Directly trigger native Android PWA install dialog
    window.triggerNativePwaInstall = async function () {
      if (!window.deferredPwaPrompt) {
        console.warn('[Oqoody PWA] No deferred prompt available. Context secure:', window.isSecureContext);
        return { success: false, reason: window.isSecureContext ? 'not_ready' : 'insecure_context' };
      }
      try {
        var promptEvent = window.deferredPwaPrompt;
        promptEvent.prompt();
        var choice = await promptEvent.userChoice;
        window.deferredPwaPrompt = null;
        return {
          success: choice && choice.outcome === 'accepted',
          outcome: choice ? choice.outcome : 'dismissed'
        };
      } catch (err) {
        console.error('[Oqoody PWA] Error triggering native prompt:', err);
        return { success: false, error: String(err) };
      }
    };
  </script>
